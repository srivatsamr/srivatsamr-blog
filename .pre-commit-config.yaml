# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        description: >
          Same check CI runs (npx prettier . --check), via the project's own
          node_modules so the version always matches package.json/CI exactly.
          Run `npm ci` once before first use.
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
